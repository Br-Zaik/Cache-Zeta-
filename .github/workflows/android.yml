
name: APK Cache Zeta Personal

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  compilar:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Detectar ZIP o carpeta
        shell: bash
        run: |
          set -euo pipefail

          PROYECTO=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$PROYECTO" ]; then
            ZIP=$(find . -maxdepth 1 -type f \
              -iname "*.zip" -print -quit)

            if [ -z "$ZIP" ]; then
              echo "No se encontro proyecto ni ZIP"
              exit 1
            fi

            mkdir -p proyecto_extraido
            unzip -q "$ZIP" -d proyecto_extraido

            PROYECTO=$(find proyecto_extraido -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)
          fi

          if [ -z "$PROYECTO" ]; then
            echo "Falta settings.gradle"
            exit 1
          fi

          CARPETA=$(dirname "$PROYECTO")
          echo "PROJECT_DIR=$(realpath "$CARPETA")" >> "$GITHUB_ENV"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            :app:assembleDebug

      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: Cache-Zeta-Personal-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
