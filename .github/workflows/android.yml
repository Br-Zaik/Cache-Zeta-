
name: APK Cache Zeta Personal

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  compilar:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Detectar ZIP o carpeta
        shell: bash
        run: |
          set -euo pipefail

          PROYECTO=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$PROYECTO" ]; then
            ZIP=$(find . -maxdepth 1 -type f \
              -iname "*.zip" -print -quit)

            if [ -z "$ZIP" ]; then
              echo "No se encontro proyecto ni ZIP"
              exit 1
            fi

            mkdir -p proyecto_extraido
            unzip -q "$ZIP" -d proyecto_extraido

            PROYECTO=$(find proyecto_extraido -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)
          fi

          if [ -z "$PROYECTO" ]; then
            echo "Falta settings.gradle"
            exit 1
          fi

          CARPETA=$(dirname "$PROYECTO")
          echo "PROJECT_DIR=$(realpath "$CARPETA")" >> "$GITHUB_ENV"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar SDK Android 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::No se encontro sdkmanager en $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          echo "SDK: $SDK_ROOT"
          echo "SDK manager: $SDKMANAGER"
          if [ -f "$SDK_ROOT/platforms/android-36/android.jar" ] && [ -f "$SDK_ROOT/build-tools/35.0.0/aapt2" ]; then
            echo "Android 36 y Build Tools 35 ya estan instalados"
          else
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36" "build-tools;35.0.0"
          fi

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            :app:assembleDebug

      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: Cache-Zeta-Personal-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
